<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:8px;padding:20px;background:var(--bg-app)}.s{flex:1;display:flex;flex-direction:column;gap:6px}.b{height:64px;border-radius:var(--radius-sm)}.n{font:var(--type-caption);color:var(--text-secondary)}.h{font-family:var(--font-sans);color:var(--text-tertiary);font-size:var(--text-xs)}.core .b{outline:2px solid var(--ink-900);outline-offset:2px}</style></head>
<body>
<div class="s"><div class="b" style="background:var(--sky-50)"></div><span class="n">50</span><span class="h">#F3F8FB</span></div>
<div class="s"><div class="b" style="background:var(--sky-100)"></div><span class="n">100 · tint</span><span class="h">#E9F1F6</span></div>
<div class="s"><div class="b" style="background:var(--sky-200)"></div><span class="n">200</span><span class="h">#DAE7EF</span></div>
<div class="s"><div class="b" style="background:var(--sky-300)"></div><span class="n">300</span><span class="h">#C1D7E5</span></div>

<div class="s core"><div class="b" style="background:var(--sky-500)"></div><span class="n">500 · accent</span><span class="h">#8DB2C9</span></div>
<div class="s"><div class="b" style="background:var(--sky-600)"></div><span class="n">600 · hover</span><span class="h">#7BA1B9</span></div>
<div class="s"><div class="b" style="background:var(--sky-700)"></div><span class="n">700 · active</span><span class="h">#6A8FA7</span></div>
</body></html>
