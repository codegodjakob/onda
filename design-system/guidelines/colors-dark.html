<!-- @dsCard group="Colors" viewport="700x170" name="Dark Mode" subtitle="data-theme=dark — warmes Fast-Schwarz, Akzent hellt auf" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:0}.wrap{display:flex}.half{flex:1;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--bg-app);min-height:170px;box-sizing:border-box}.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:12px 14px;display:flex;flex-direction:column;gap:4px}.t{font:var(--type-label);color:var(--text-primary)}.s{font:var(--type-caption);color:var(--text-secondary)}.btn{align-self:flex-start;font:var(--type-label);color:var(--on-accent);background:var(--accent);border-radius:var(--radius-control);padding:6px 12px}</style></head>
<body><div class="wrap">
<div class="half"><div class="card"><span class="t">Hell · Papier</span><span class="s">#F7F6F3 · Karten weiß, Haarlinien</span></div><span class="btn">Weiter</span></div>
<div class="half" data-theme="dark"><div class="card"><span class="t">Dunkel · Tinte</span><span class="s">#141310 · Akzent hellt auf</span></div><span class="btn">Weiter</span></div>
</div></body></html>
