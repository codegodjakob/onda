<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:8px;padding:20px;background:var(--bg-app)}.s{flex:1;display:flex;flex-direction:column;gap:6px}.b{height:64px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{font:var(--type-caption);color:var(--text-secondary)}.h{font:var(--type-caption);font-family:var(--font-sans);color:var(--text-tertiary);font-size:var(--text-xs)}</style></head>
<body>
<div class="s"><div class="b" style="background:var(--paper)"></div><span class="n">paper</span><span class="h">#F7F6F3</span></div>
<div class="s"><div class="b" style="background:var(--surface)"></div><span class="n">surface</span><span class="h">#FFFFFF</span></div>
<div class="s"><div class="b" style="background:var(--surface-2)"></div><span class="n">surface-2</span><span class="h">#F2F0EB</span></div>
<div class="s"><div class="b" style="background:var(--ink-100)"></div><span class="n">ink-100</span><span class="h">#E7E2DA</span></div>
<div class="s"><div class="b" style="background:var(--ink-300)"></div><span class="n">ink-300</span><span class="h">#B6AFA4</span></div>
<div class="s"><div class="b" style="background:var(--ink-500)"></div><span class="n">ink-500</span><span class="h">#736D64</span></div>
<div class="s"><div class="b" style="background:var(--ink-700)"></div><span class="n">ink-700</span><span class="h">#423E39</span></div>
<div class="s"><div class="b" style="background:var(--ink-900)"></div><span class="n">ink-900</span><span class="h">#1C1A17</span></div>
</body></html>
