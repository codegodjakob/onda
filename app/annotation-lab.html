<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onda · Anmerkungsgalerie</title>
  <link rel="stylesheet" href="src/onda-tokens.css" />
  <link rel="stylesheet" href="src/onda-annotations.css" />
  <style>
    * { box-sizing: border-box; }
    html { background: var(--bg-app); color: var(--text-primary); font-family: var(--font-sans); }
    body { margin: 0; min-width: 0; }
    button, input { font-family: inherit; }
    :focus-visible { outline: 2px solid transparent; outline-offset: 2px; box-shadow: var(--shadow-focus); }
    .lab { width: min(100%, 1180px); margin-inline: auto; padding: var(--space-8) var(--space-6) var(--space-12); }
    .lab__aura { width: 48px; height: 18px; margin-bottom: var(--space-6); border-radius: var(--radius-full); background: var(--gradient-aura); box-shadow: var(--shadow-glow); }
    .lab__title { margin: 0; font: var(--type-display); letter-spacing: var(--tracking-tighter); }
    .lab__intro { max-width: 680px; margin: var(--space-4) 0 var(--space-8); color: var(--text-secondary); font: var(--type-body); }
    .lab__group { margin-top: var(--space-9); }
    .lab__group-title { margin: 0 0 var(--space-4); font: var(--type-title); }
    .lab__grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--space-6); align-items: start; }
    .lab__case { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
    .lab__sample { padding: var(--space-5); border-radius: var(--radius-panel); background: var(--bg-surface); font: var(--type-body); line-height: var(--leading-relaxed); }
    .lab__status { min-height: 20px; color: var(--text-tertiary); font: var(--type-caption); }
    @media (max-width: 760px) { .lab { padding-inline: var(--space-4); } .lab__grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="annotationLab" class="lab"></main>
  <script type="module" src="src/annotation-lab.mjs"></script>
</body>
</html>
