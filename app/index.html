<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schreibwerkzeug</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body class="view-home">
  <div id="app">

    <!-- Bibliothek: Startseite mit allen Texten (später: Projekte, Quellen) -->
    <section id="home">
      <div id="homeInner">
        <button id="crumb" class="crumb" hidden>‹ Projekte</button>
        <div class="home-head">
          <span class="home-title" id="homeTitle">Projekte</span>
          <button id="newBtn" title="Neu"></button>
        </div>
        <div class="home-tools">
          <input id="search" type="text" placeholder="Suchen …" spellcheck="false" />
          <button id="sortBtn" title="Sortierung wechseln"></button>
        </div>
        <div id="doclist"></div>
        <div id="trash">
          <button id="trashToggle" class="trash-toggle">Papierkorb <span id="trashCount"></span></button>
          <div id="trashlist" hidden></div>
        </div>
      </div>
    </section>

    <!-- Schreibansicht: Der Text bleibt dominant; weitere Ebenen erscheinen nur im Kontext. -->
    <section id="editorView">
      <header id="workspaceHeader">
        <button id="workspaceBack" class="icon-button" title="Zur Projektübersicht" aria-label="Zur Projektübersicht">←</button>
        <button id="workspacePath" class="workspace-path" title="Struktur öffnen" aria-controls="structureShelf"></button>
        <button id="agentPresence" class="icon-button agent-presence" title="Agentengespräch öffnen" aria-label="Agentengespräch öffnen" aria-controls="agentWidget">◌</button>
      </header>
      <div id="workspaceBody">
        <aside id="structureShelf" hidden></aside>
        <main id="main">
          <div id="scroll">
            <div id="page">
              <textarea id="title" rows="1" placeholder="Titel" spellcheck="false"></textarea>
              <div id="editor"></div>
            </div>
          </div>
          <div id="blockInsertLayer"></div>
          <aside id="localAgentLayer"></aside>
        </main>
      </div>
      <aside id="agentWidget" hidden aria-label="Agentengespräch"></aside>
      <aside id="evidenceWindow" hidden aria-label="Quellen und Fundstellen"></aside>
      <div id="agentLiveStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    <div id="saveAlert" hidden role="alert" aria-live="assertive" aria-atomic="true"></div>

  </div>
  <script src="dist/editor.bundle.js"></script>
  <script>AIWT.boot()</script>
</body>
</html>
