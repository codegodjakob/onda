<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schreibwerkzeug</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <aside id="side">
      <div class="side-top">
        <span class="side-label">Texte</span>
        <button id="newBtn" title="Neuer Text (⌘N)">+</button>
      </div>
      <div class="side-search">
        <input id="search" type="text" placeholder="Suchen …" spellcheck="false" />
        <button id="sortBtn" title="Sortierung wechseln">⇅</button>
      </div>
      <div id="doclist"></div>
      <div id="trash">
        <button id="trashToggle" class="trash-toggle">Papierkorb <span id="trashCount"></span></button>
        <div id="trashlist" hidden></div>
      </div>
    </aside>
    <main id="main">
      <div id="bar"></div>
      <div id="scroll">
        <div id="page">
          <textarea id="title" rows="1" placeholder="Titel" spellcheck="false"></textarea>
          <div id="editor"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="dist/editor.bundle.js"></script>
  <script>AIWT.boot()</script>
</body>
</html>
