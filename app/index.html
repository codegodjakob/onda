<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onda</title>
<link rel="stylesheet" href="src/onda-tokens.css" />
<link rel="stylesheet" href="src/style.css" />
<link rel="stylesheet" href="src/onda-shell.css" />
<link rel="stylesheet" href="src/onda-annotations.css" />
</head>
<body class="view-home">
  <div id="app" class="onda-app-shell">

    <aside id="librarySidebar" class="onda-library-sidebar" aria-label="Bibliotheksleiste">
      <div class="onda-library-brand">
        <span class="onda-wordmark">Onda Write</span>
      </div>
      <nav class="onda-library-nav" aria-label="Bibliothek">
        <button id="libraryProjects" class="onda-library-nav__item is-active" type="button" aria-current="page">Projekte</button>
        <button id="libraryDocuments" class="onda-library-nav__item" type="button">Dokumente</button>
        <button id="libraryArchive" class="onda-library-nav__item" type="button">Papierkorb</button>
      </nav>
      <section class="onda-library-recent" aria-labelledby="libraryRecentTitle">
        <p id="libraryRecentTitle" class="onda-eyebrow">Zuletzt bearbeitet</p>
        <div id="libraryRecent"></div>
      </section>
      <div class="onda-library-footer">
        <span class="onda-avatar" aria-hidden="true">J</span>
        <span>Jakob</span>
      </div>
    </aside>

    <main id="ondaMain" aria-label="Onda Write">

    <!-- Bibliothek: Startseite mit allen Texten (später: Projekte, Quellen) -->
    <section id="home">
      <div id="homeInner">
        <button id="crumb" class="crumb" hidden><span>Projekte</span></button>
        <div class="home-head">
          <div>
            <span class="onda-eyebrow">Bibliothek</span>
            <h1 class="home-title" id="homeTitle">Projekte</h1>
            <p id="homeCount" class="home-count" aria-live="polite"></p>
          </div>
          <div class="home-head__actions">
            <button id="newBtn" class="onda-primary-action" title="Neu"><span>Neu</span></button>
          </div>
        </div>
        <div class="home-tools">
          <label class="onda-search-field">
            <span class="visually-hidden">Dokumente durchsuchen</span>
            <input id="search" type="search" placeholder="Dokumente durchsuchen …" spellcheck="false" />
          </label>
          <button id="sortBtn" title="Sortierung wechseln"></button>
        </div>
        <div class="onda-list-head" aria-hidden="true">
          <span>Name</span><span>Status</span><span>Bearbeitet</span>
        </div>
        <div id="doclist"></div>
        <div id="trash">
          <button id="trashToggle" class="trash-toggle">Papierkorb <span id="trashCount"></span></button>
          <div id="trashlist" hidden></div>
        </div>
      </div>
    </section>

    <!-- Schreibansicht: Der Text bleibt dominant; Rahmen (Seitenleiste, Aura) sind ruhig. -->
    <section id="editorView">
      <!-- Die Klinke der Seitenleiste. EIN Knopf statt zweier, und wie der Orb
           gegenüber am Fenster verankert: eingeklappt wie ausgeklappt dieselbe Stelle.
           Zwei Knöpfe in zwei verschiedenen Kästen können nicht gleich stehen — der
           eine hing an der rechten Innenkante der Leiste, der andere am linken Rand der
           Topbar, und die Leiste selbst wandert beim Einklappen um ihre volle Breite.

           Sie steht VOR der Seitenleiste im Dokument, weil sie auf dem Schirm ganz
           links oben steht: der Tastaturweg muss der gleiche sein wie der Blick
           (WCAG 2.4.3). Stand sie hinter der Leiste, kam der sichtbar erste Knopf als
           fünfunddreißigster. Der Platz bleibt davon unberührt — position:fixed. -->
      <!-- Der Schriftzug steht bei der Klinke, nicht in der Leiste. In der Leiste fuhr er
           beim Einklappen mit ihr hinaus — oben links wohnte er also nicht, er war dort
           nur zu Besuch. Am Fenster verankert bleibt er, was er ist: der Name des
           Programms und der Weg nach Hause (Jakob, 8.8.2026). -->
      <div class="onda-topbar__lead">
        <button id="sidebarToggle" class="onda-icon-btn" type="button" aria-controls="ondaSidebar" aria-expanded="true"></button>
        <button id="ondaHome" class="onda-wordmark onda-wordmark-btn" type="button" title="Zur Übersicht" aria-label="Zur Projekt- und Dokumentübersicht">Onda Write</button>
      </div>

      <aside id="ondaSidebar" class="onda-sidebar">
        <!-- Wo man ist, steht ganz oben — dort sucht man es. Unten links, eingeklemmt
             zwischen zwei Zahnrädern, blieben von „Beispiel: Calm Technology" 91 Pixel
             übrig: elf Zeichen und drei Punkte. Hier hat der Name die volle Breite und
             darf umbrechen. -->
        <div class="onda-brand">
          <button id="sidebarBack" class="onda-side-back" type="button" title="Zur Übersicht" aria-label="Zur Projekt- und Dokumentübersicht">
            <span class="onda-side-back-chevron" aria-hidden="true"></span>
            <span class="onda-side-back-label">Projekt</span>
          </button>
        </div>

        <!-- Genau drei Abschnitte: Projektverständnis · Struktur · Quellen.
             Jeder hat dieselbe Kopfzeile mit zwei getrennten Gesten: der NAME öffnet
             das Fenster zum Nachschauen, der PFEIL daneben klappt den Baum auf und zu.
             Projektverständnis hat keinen Baum — dort führt nur der Name weiter. -->
        <nav class="onda-project-nav" aria-label="Projekt">
          <section class="onda-side-section">
            <div class="onda-side-kopf">
              <button id="pvCard" class="onda-side-name" type="button" aria-haspopup="dialog" aria-controls="pvModal">Projektverständnis</button>
            </div>
            <p id="pvClaim" class="onda-side-claim"></p>
          </section>

          <div id="structureNav" class="onda-side-section" role="navigation" aria-label="Struktur">
            <div class="onda-side-kopf">
              <button id="structureOpen" class="onda-side-name" type="button" aria-haspopup="dialog" aria-controls="strukturModal">Struktur</button>
              <button id="structureTree" class="onda-side-pfeil" type="button" aria-expanded="true" aria-controls="structureNavList" aria-label="Struktur zuklappen"></button>
            </div>
            <div id="structureNavList" class="structure-nav-list"></div>
          </div>

          <section id="materialNav" class="onda-side-section">
            <div class="onda-side-kopf">
              <button id="materialSources" class="onda-side-name" type="button" aria-haspopup="dialog" aria-controls="materialModal">
                <span class="onda-material-label">Quellen</span>
                <span id="materialSourcesCount" class="onda-badge onda-material-count">0</span>
              </button>
              <button id="materialTreeToggle" class="onda-side-pfeil" type="button" aria-expanded="false" aria-controls="materialTree" aria-label="Quellen aufklappen"></button>
            </div>
            <div id="materialTree" class="onda-side-baum" hidden></div>
          </section>
        </nav>

        <!-- Unten links stand erst der eigene Name, dann der Weg zurück. Beides ist fort:
             wer allein an seinem Rechner schreibt, muss nicht daran erinnert werden, wer
             er ist, und der Weg zurück steht jetzt oben. Übrig bleiben zwei Zeichen ohne
             Wortlaut — an ihnen kann nichts abgeschnitten werden. -->
        <div class="onda-side-footer">
          <button id="themeToggle" class="onda-icon-btn" title="Erscheinung wechseln" aria-label="Erscheinung wechseln"></button>
          <button id="kiSettings" class="onda-icon-btn" title="KI-Anschluss" aria-label="KI-Anschluss einrichten" aria-haspopup="dialog" aria-controls="kiModal"></button>
        </div>
      </aside>

      <div class="onda-editor-col">
        <header class="onda-topbar">
          <div class="onda-topbar__aside">
            <!-- Der andere Stift (docs/PHILOSOPHIE.md §1). Das EINZIGE Bedienelement fuer
                 Anmerkungen: es sagt, dass welche da sind, und blendet sie aus und ein.
                 Es erscheint nur, wenn es etwas zu sagen gibt. -->
            <button id="annotationPresence" class="onda-presence" type="button" aria-pressed="true" hidden></button>
            <button id="ondaAura" class="onda-aura" title="Agentengespräch öffnen" aria-label="Agentengespräch öffnen" aria-controls="agentWidget" aria-expanded="false"></button>
          </div>
        </header>
        <div id="scroll" role="region" aria-label="Schreibfläche">
          <div id="page">
            <textarea id="title" rows="1" placeholder="Titel" spellcheck="false"></textarea>
            <div id="editor"></div>
          </div>
        </div>
        <aside id="localAgentLayer"></aside>
      </div>

      <!-- Die Silhouette der Sprechblase. Eine eigene Fläche, nicht ein Kind des
           Fensters — aus zwei Gründen: der drop-shadow würde sonst vom overflow:hidden
           des Fensters abgeschnitten, und das Fenster behält so seine hidden-Semantik,
           während die Kontur ihre eigene Bewegung hat. Sie trägt keinen Wortlaut; was
           sie zeigt, ist reine Form (docs/PHILOSOPHIE.md §1: Zurückhaltung gilt den
           Augen, nicht der Zugänglichkeit — hier gibt es nichts vorzulesen). -->
      <svg id="ondaBlase" hidden aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="ondaBlaseSchnitt" clipPathUnits="userSpaceOnUse">
            <path class="onda-blase__schnitt" d="" />
          </clipPath>
        </defs>
        <path class="onda-blase__pfad" d="" />
      </svg>
      <aside id="agentWidget" hidden aria-label="Agentengespräch"></aside>
      <aside id="evidenceWindow" hidden aria-label="Quellen und Fundstellen"></aside>
      <div id="agentLiveStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    </main>

    <div id="saveAlert" hidden role="alert" aria-live="assertive" aria-atomic="true"></div>

  </div>
  <script src="dist/editor.bundle.js"></script>
  <script>AIWT.boot()</script>
</body>
</html>
