<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Onda</title>
<link rel="stylesheet" href="src/onda-tokens.css" />
<link rel="stylesheet" href="src/style.css" />
<link rel="stylesheet" href="src/onda-shell.css" />
<link rel="stylesheet" href="src/onda-annotations.css" />
</head>
<body class="view-home">
  <div id="app" class="onda-app-shell">

    <aside id="librarySidebar" class="onda-library-sidebar" aria-label="Bibliotheksleiste">
      <div class="onda-library-brand">
        <span class="onda-wordmark">Onda Write</span>
      </div>
      <nav class="onda-library-nav" aria-label="Bibliothek">
        <button id="libraryProjects" class="onda-library-nav__item is-active" type="button" aria-current="page">Projekte</button>
        <button id="libraryDocuments" class="onda-library-nav__item" type="button">Dokumente</button>
        <button id="libraryArchive" class="onda-library-nav__item" type="button">Papierkorb</button>
      </nav>
      <section class="onda-library-recent" aria-labelledby="libraryRecentTitle">
        <p id="libraryRecentTitle" class="onda-eyebrow">Zuletzt bearbeitet</p>
        <div id="libraryRecent"></div>
      </section>
      <div class="onda-library-footer">
        <span class="onda-avatar" aria-hidden="true">J</span>
        <span>Jakob</span>
      </div>
    </aside>

    <main id="ondaMain" aria-label="Onda Write">

    <!-- Bibliothek: Startseite mit allen Texten (später: Projekte, Quellen) -->
    <section id="home">
      <div id="homeInner">
        <button id="crumb" class="crumb" hidden><span>Projekte</span></button>
        <div class="home-head">
          <div>
            <span class="onda-eyebrow">Bibliothek</span>
            <h1 class="home-title" id="homeTitle">Projekte</h1>
            <p id="homeCount" class="home-count" aria-live="polite"></p>
          </div>
          <div class="home-head__actions">
            <button id="newBtn" class="onda-primary-action" title="Neu"><span>Neu</span></button>
          </div>
        </div>
        <div class="home-tools">
          <label class="onda-search-field">
            <span class="visually-hidden">Dokumente durchsuchen</span>
            <input id="search" type="search" placeholder="Dokumente durchsuchen …" spellcheck="false" />
          </label>
          <button id="sortBtn" title="Sortierung wechseln"></button>
        </div>
        <div class="onda-list-head" aria-hidden="true">
          <span>Name</span><span>Status</span><span>Bearbeitet</span>
        </div>
        <div id="doclist"></div>
        <div id="trash">
          <button id="trashToggle" class="trash-toggle">Papierkorb <span id="trashCount"></span></button>
          <div id="trashlist" hidden></div>
        </div>
      </div>
    </section>

    <!-- Schreibansicht: Der Text bleibt dominant; Rahmen (Seitenleiste, Aura) sind ruhig. -->
    <section id="editorView">
      <aside id="ondaSidebar" class="onda-sidebar">
        <div class="onda-brand">
          <!-- Der Name ist der Weg nach Hause. Wer oben links auf das Logo klickt,
               erwartet die Übersicht — das ist in jedem Programm so. -->
          <button id="ondaHome" class="onda-wordmark onda-wordmark-btn" type="button" title="Zur Übersicht" aria-label="Zur Projekt- und Dokumentübersicht">Onda</button>
          <button id="sidebarCollapse" class="onda-icon-btn" title="Seitenleiste einklappen" aria-label="Seitenleiste einklappen" aria-controls="ondaSidebar" aria-expanded="true"></button>
        </div>

        <nav class="onda-project-nav" aria-label="Projekt">
          <section class="onda-side-section">
            <span class="onda-eyebrow">Projektverständnis</span>
            <button id="pvCard" class="onda-pv-card" aria-haspopup="dialog" aria-controls="pvModal">
              <span class="onda-pv-title">Projektverständnis</span>
              <span class="onda-pv-claim">Noch nicht festgelegt</span>
            </button>
          </section>

          <div id="structureNav" class="onda-side-section" role="navigation" aria-label="Struktur">
            <span class="onda-eyebrow">Struktur</span>
          </div>

          <div id="zurueckgehalten" class="onda-side-zurueck" hidden></div>

          <section id="erweiterungen" class="onda-side-section onda-side-erweiterungen" aria-label="Erweiterungen">
            <span class="onda-eyebrow">Erweiterungen</span>
          </section>

          <section id="erkanntes" class="onda-side-section onda-side-erkanntes" aria-label="Erkanntes">
            <span class="onda-eyebrow">Erkanntes</span>
          </section>

          <section class="onda-side-section onda-side-material">
            <span class="onda-eyebrow">Material</span>
            <button id="materialSources" class="onda-material-btn">
              <span class="onda-material-label">Quellen im Projekt</span>
              <span id="materialSourcesCount" class="onda-badge">0</span>
            </button>
          </section>
        </nav>

        <!-- Unten links stand der eigene Name mit Bildzeichen. Wer allein an seinem
             Rechner schreibt, muss nicht daran erinnert werden, wer er ist. An seiner
             Stelle steht jetzt der Weg zurück zur Übersicht. -->
        <div class="onda-side-footer">
          <button id="sidebarBack" class="onda-side-back" type="button" title="Zur Übersicht" aria-label="Zur Projekt- und Dokumentübersicht">
            <span class="onda-side-back-chevron" aria-hidden="true"></span>
            <span class="onda-side-back-label">Projekt</span>
          </button>
          <button id="themeToggle" class="onda-icon-btn" title="Erscheinung wechseln" aria-label="Erscheinung wechseln"></button>
          <button id="kiSettings" class="onda-icon-btn" title="KI-Anschluss" aria-label="KI-Anschluss einrichten" aria-haspopup="dialog" aria-controls="kiModal"></button>
        </div>
      </aside>

      <div class="onda-editor-col">
        <header class="onda-topbar">
          <button id="sidebarReopen" class="onda-icon-btn" title="Seitenleiste einblenden" aria-label="Seitenleiste einblenden" aria-controls="ondaSidebar" aria-expanded="false" hidden></button>
          <div class="onda-topbar__aside">
            <!-- Der andere Stift (docs/PHILOSOPHIE.md §1). Das EINZIGE Bedienelement fuer
                 Anmerkungen: es sagt, dass welche da sind, und blendet sie aus und ein.
                 Es erscheint nur, wenn es etwas zu sagen gibt. -->
            <button id="annotationPresence" class="onda-presence" type="button" aria-pressed="true" hidden></button>
            <button id="ondaAura" class="onda-aura" title="Agentengespräch öffnen" aria-label="Agentengespräch öffnen" aria-controls="agentWidget" aria-expanded="false"></button>
          </div>
        </header>
        <div id="scroll" role="region" aria-label="Schreibfläche">
          <div id="page">
            <textarea id="title" rows="1" placeholder="Titel" spellcheck="false"></textarea>
            <div id="editor"></div>
          </div>
        </div>
        <aside id="localAgentLayer"></aside>
      </div>

      <aside id="agentWidget" hidden aria-label="Agentengespräch"></aside>
      <aside id="evidenceWindow" hidden aria-label="Quellen und Fundstellen"></aside>
      <div id="agentLiveStatus" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>

    </main>

    <div id="saveAlert" hidden role="alert" aria-live="assertive" aria-atomic="true"></div>

  </div>
  <script src="dist/editor.bundle.js"></script>
  <script>AIWT.boot()</script>
</body>
</html>
