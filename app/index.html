<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schreibwerkzeug</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body class="view-home">
  <div id="app">

    <!-- Bibliothek: Startseite mit allen Texten (später: Projekte, Quellen) -->
    <section id="home">
      <div id="homeInner">
        <button id="crumb" class="crumb" hidden>‹ Projekte</button>
        <div class="home-head">
          <span class="home-title" id="homeTitle">Projekte</span>
          <button id="newBtn" title="Neu"></button>
        </div>
        <div class="home-tools">
          <input id="search" type="text" placeholder="Suchen …" spellcheck="false" />
          <button id="sortBtn" title="Sortierung wechseln"></button>
        </div>
        <div id="doclist"></div>
        <div id="trash">
          <button id="trashToggle" class="trash-toggle">Papierkorb <span id="trashCount"></span></button>
          <div id="trashlist" hidden></div>
        </div>
      </div>
    </section>

    <!-- Schreibansicht: Text in der Mitte, Mini-Gliederung links im Textbereich,
         Formulierungs-Spalte rechts am Text, Panels ein-/ausklappbar über die Rand-Leisten. -->
    <section id="editorView">
      <div id="railL" class="rail"></div>
      <aside id="pStruct" class="panel" hidden></aside>
      <div id="main">
        <div id="bar"></div>
        <div id="mainBody">
          <nav id="minimap" aria-label="Gliederung"></nav>
          <div id="scroll">
            <div id="page">
              <textarea id="title" rows="1" placeholder="Titel" spellcheck="false"></textarea>
              <div id="editor"></div>
            </div>
          </div>
          <aside id="lane" hidden></aside>
        </div>
      </div>
      <aside id="pCoach" class="panel panel-right" hidden></aside>
      <div id="railR" class="rail"></div>
    </section>

    <!-- Struktur-Seite: Material sammeln → Bausteine ordnen → Narrative → Coach. -->
    <section id="structView">
      <div id="railSL" class="rail"></div>
      <div id="stCanvas" class="st-col st-canvas"></div>
      <div id="stStruct" class="st-col"></div>
      <div id="stNarr" class="st-col st-narr"></div>
      <aside id="stCoach" class="panel panel-right st-coach"></aside>
      <div id="railSR" class="rail"></div>
    </section>

  </div>
  <script src="dist/editor.bundle.js"></script>
  <script>AIWT.boot()</script>
</body>
</html>
