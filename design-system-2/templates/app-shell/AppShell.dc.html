<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App-Shell" description="Web-App-Grundgerüst im Onda-Stil: schwebende Flächen ohne Trennlinien, Pill-Navigation, ruhige Inhaltsfläche." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;height:100vh;padding:10px;gap:6px;background:var(--bg-app);font-family:var(--font-sans);color:var(--text-primary)">
<aside style="width:252px;flex:none;display:flex;flex-direction:column;gap:20px;padding:14px 10px">
<div style="display:flex;align-items:center;gap:9px;padding:2px 12px 4px;font-size:15px;font-weight:700;letter-spacing:-0.02em"><x-import component-from-global-scope="AuraDesignSystem_6ddaae.Aura" state="quiet" size="20" hint-size="20px,20px"></x-import><span>Onda App</span></div>
<nav style="display:flex;flex-direction:column;gap:2px">
<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--bg-active);color:var(--text-primary);font-size:15px;font-weight:500;cursor:pointer">Übersicht</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;color:var(--text-secondary);font-size:15px;font-weight:500;cursor:pointer;transition:color 120ms,background-color 120ms" style-hover="background:var(--bg-hover);color:var(--text-primary)">Projekte</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;color:var(--text-secondary);font-size:15px;font-weight:500;cursor:pointer;transition:color 120ms,background-color 120ms" style-hover="background:var(--bg-hover);color:var(--text-primary)">Archiv</div>
</nav>
<div style="margin-top:auto;padding:12px 12px 4px;display:flex;align-items:center;gap:10px">
<x-import component-from-global-scope="AuraDesignSystem_6ddaae.Avatar" name="Mira Lang" size="sm" hint-size="24px,24px"></x-import>
<span style="font-size:15px;font-weight:500">Mira Lang</span>
</div>
</aside>
<div style="flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-surface);border-radius:24px;overflow:hidden">
<header style="height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px">
<span style="font-size:15px;font-weight:700">Übersicht</span>
<x-import component-from-global-scope="AuraDesignSystem_6ddaae.Button" hint-size="150px,40px">Neu erstellen</x-import>
</header>
<main style="flex:1;overflow-y:auto;padding:36px 44px 56px">
<div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px">
<h1 style="font-size:40px;font-weight:700;letter-spacing:-0.03em;line-height:1.05">Guten Morgen, Mira</h1>
<p style="font-size:15px;line-height:1.5;color:var(--text-secondary);max-width:560px;text-wrap:pretty">Diese Fläche gehört deinem Inhalt. Das Gerüst — Navigation, Kopfzeile, Lesebreite — steht bereits im Onda-Stil: weiche Flächen statt Trennlinien, runde Controls, ein Akzent.</p>
</div>
</main>
</div>
</div>
</x-dc>
</body>
</html>
