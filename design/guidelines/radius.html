<!-- @dsCard group="Spacing" viewport="700x150" name="Radien" subtitle="Nur zwei: Pille für alle Controls, 24px für alle Flächen" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:26px 32px;background:var(--bg-app);display:flex;gap:40px;align-items:flex-start}.g{display:flex;flex-direction:column;gap:10px}.n{font:var(--type-caption);color:var(--text-tertiary)}.panel{width:120px;height:72px;background:var(--bg-surface);border-radius:var(--radius-panel)}.pill{width:150px;height:40px;border-radius:var(--radius-control);background:var(--bg-surface)}.chk{width:18px;height:18px;border-radius:var(--radius-sm);background:var(--bg-surface)}</style></head>
<body>
<div class="g"><div class="pill"></div><span class="n">--radius-control · Pille — Buttons, Felder, Tabs, Chips</span></div>
<div class="g"><div class="panel"></div><span class="n">--radius-panel / -card / -overlay · 24px — Flächen, Karten, Dialoge, Blasen</span></div>
<div class="g"><div class="chk"></div><span class="n">--radius-sm · 4px — nur Häkchen</span></div>
</body></html>
