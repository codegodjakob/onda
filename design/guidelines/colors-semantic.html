<!-- @dsCard group="Colors" viewport="700x140" name="Semantik" subtitle="Keine Statusfarben — Zustände sind neutral. Rot allein für Fehler und Zerstörendes" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:14px;padding:24px 28px;background:var(--bg-app);align-items:flex-start}.g{flex:1;display:flex;flex-direction:column;gap:8px}.pair{display:flex;height:52px;border-radius:var(--radius-lg);overflow:hidden}.pair div{flex:1}.n{font:var(--type-caption);color:var(--text-secondary)}.h{font-family:var(--font-sans);font-size:var(--text-xs);color:var(--text-tertiary)}</style></head>
<body>
<div class="g"><div class="pair"><div style="background:var(--text-secondary)"></div><div style="background:var(--bg-sunken)"></div></div><span class="n">Neutral — Erfolg, Info, Warnung</span><span class="h">--text-secondary · --bg-sunken</span></div>
<div class="g"><div class="pair"><div style="background:var(--danger)"></div><div style="background:var(--danger-tint)"></div></div><span class="n">Gefahr — Fehler, Löschen</span><span class="h">#6B4A44 · #F0DCD8</span></div>
<div class="g"><div class="pair"><div style="background:var(--accent)"></div><div style="background:var(--accent-tint)"></div></div><span class="n">Akzent — Aktion, Auswahl, Fokus</span><span class="h">#1C1A17 · #E7E2DA</span></div>
</body></html>
