<!-- @dsCard group="Colors" viewport="700x170" name="Aura-Verlauf" subtitle="Signatur der KI-Präsenz — lebt sichtbar: Verlauf rotiert, Halo pulsiert" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{display:flex;gap:20px;padding:20px;background:var(--bg-app);align-items:stretch}.col{flex:1;display:flex;flex-direction:column;gap:8px}.band{height:64px;border-radius:var(--radius-md);background:var(--gradient-aura)}.soft{height:28px;border-radius:var(--radius-sm);background:var(--gradient-aura-soft)}.n{font:var(--type-caption);color:var(--text-secondary)}.orbwrap{width:130px;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center}.orb{position:relative;width:56px;height:56px;border-radius:var(--radius-full)}.orb::before{content:"";position:absolute;inset:-16%;border-radius:var(--radius-full);background:var(--gradient-aura);filter:blur(12px);animation:halo 4.5s var(--ease-in-out) infinite}.disc{position:absolute;inset:0;border-radius:var(--radius-full);overflow:hidden;box-shadow:var(--shadow-glow);display:block}.swirl{position:absolute;inset:-30%;background:var(--gradient-aura);animation:spin 9s linear infinite;display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes halo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}@media (prefers-reduced-motion:reduce){.orb::before,.swirl{animation:none}}</style></head>
<body>
<div class="col"><div class="band"></div><span class="n">--gradient-aura · achromatisch — Papier bis Tinte, keine Farbe</span><div class="soft"></div><span class="n">--gradient-aura-soft · Flächen hinter KI-Inhalt</span></div>
<div class="orbwrap"><div class="orb"><span class="disc"><span class="swirl"></span></span></div><span class="n">Aura-Orb — Swirl + Halo</span></div>
</body></html>
