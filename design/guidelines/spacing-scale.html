<!DOCTYPE html>

<div class="r"><span class="n">--space-1 · 4px</span><div class="bar" style="width:4px"></div></div>

<div class="r"><span class="n">--space-3 · 12px</span><div class="bar" style="width:12px"></div></div>
<div class="r"><span class="n">--space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="r"><span class="n">--space-6 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="r"><span class="n">--space-7 · 32px</span><div class="bar" style="width:32px"></div></div>

<div class="r"><span class="n">--space-10 · 64px</span><div class="bar" style="width:64px;background:var(--accent-tint-hover)"></div></div>
</body></html>
