<!-- @dsCard group="Spacing" viewport="700x230" name="Weiche Panels & Pill-Leiste" subtitle="--radius-panel + fast unsichtbare Haarlinie · Pill-Composer" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-app);display:flex;flex-direction:column;gap:16px}.panel{max-width:340px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-panel);padding:16px 18px;display:flex;flex-direction:column;gap:12px}.panel .t{font:var(--type-label);color:var(--text-tertiary)}.chips{display:flex;gap:8px}.chip{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--bg-sunken);border:1px solid var(--border-subtle)}.bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 8px 0 18px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-pill);box-shadow:var(--shadow-xs)}.bar .plus{color:var(--text-tertiary);font-size:20px;line-height:1}.bar .ph{flex:1;font-size:var(--text-base);color:var(--text-tertiary)}.bar .send{width:38px;height:38px;border-radius:var(--radius-full);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:var(--text-base)}</style></head>
<body data-theme="dark">
<div class="panel"><span class="t">Quellen</span><div class="chips"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div></div>
<div class="bar"><span class="plus">+</span><span class="ph">Beschreibe deinen Gedanken …</span><span class="send">↑</span></div>
</body></html>
